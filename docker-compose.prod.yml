# Production configuration - use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

version: '3.9'

services:
  backend:
    environment:
      - DEBUG_MODE=false
      - LOG_LEVEL=WARNING
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  frontend:
    environment:
      - REACT_APP_DEBUG=false

  postgres:
    environment:
      - POSTGRES_INITDB_ARGS=-c max_connections=100
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  redis:
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
